# GitHub Pages deployment workflow for the PEBD Calculator.
# Replaces the legacy pages-build-deployment with an explicit Actions workflow
# that is visible in the Actions tab and can be extended with build / validate steps.
#
# After merging this file, switch the Pages source in repo Settings:
#   Settings > Pages > Build and deployment > Source: GitHub Actions
#
# This is a static-site deployment with no build step. Only the files the two
# pages use are published: uploading the repo root also served working notes,
# old index copies and other internal files as public pages.

name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Cancel any in-progress run when a new commit lands on main.
concurrency:
  group: pages
  cancel-in-progress: true

# Grant the workflow the minimum permissions needed to publish Pages
# and write the deployment status back to the commit.
permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    name: Build site
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Assemble the published files
        run: |
          set -euo pipefail
          mkdir -p _site
          # The two pages, everything they load, and the legal documents they link.
          cp index.html pay-comparison.html semper-tokens.css _site/
          cp favicon.ico favicon.svg apple-touch-icon.png apple-touch-icon-precomposed.png robots.txt _site/
          cp PRIVACY_POLICY.md TERMS_OF_SERVICE.md ACCESSIBILITY.md _site/
          cp -R assets _site/assets
          touch _site/.nojekyll
          find _site -maxdepth 1 | sort

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload the published files
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    name: Deploy to Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy artifact
        id: deployment
        uses: actions/deploy-pages@v4
